name: Alterações Euribor - alerta GitHub 8h

on:
  schedule:
    - cron: "25 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: alertas-github-com-estado
  cancel-in-progress: false

jobs:
  verificar-euribor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter o repositório
        uses: actions/checkout@v5
      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Consultar as taxas Euribor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python euribor_alerta_github.py
      - name: Guardar as taxas de referência
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- euribor_alerta_github_estado.json)" ]; then
            echo "Não há alterações para guardar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add euribor_alerta_github_estado.json
          git commit -m "Atualizar referência Euribor do alerta GitHub ($(date -u +%F))"
          git push
