name: Avisar no Telegram

# Desativado: cada automação relevante já envia a sua própria notificação.
# Manter este workflow ativo causava mensagens técnicas em todos os pushes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  avisar:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - name: Enviar mensagem
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO: ${{ github.repository }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=✅ Atualização no GitHub: ${REPO}"
