name: Alerta de alteração no câmbio BHD

on:
  schedule:
    # Verifica de hora a hora. O GitHub Actions usa UTC.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: alerta-cambio-bhd
  cancel-in-progress: false

jobs:
  verificar-cambio:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Obter o repositório
        uses: actions/checkout@v5

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Consultar taxas e notificar se mudaram
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python cambio_bhd_alerta.py

      - name: Guardar a referência mais recente
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- cambio_bhd_alerta_estado.json)" ]; then
            echo "As taxas não mudaram; não há nada para guardar."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cambio_bhd_alerta_estado.json
          git commit -m "Atualizar referência do câmbio BHD ($(date -u +%F))"
          git push
