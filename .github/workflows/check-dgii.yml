name: Verificar avisos da DGII

on:
  schedule:
    # Segunda-feira às 09:00 na República Dominicana (13:00 UTC).
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: check-dgii
  cancel-in-progress: false

jobs:
  check-dgii:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Obter o repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: python -m pip install --requirement requirements.txt

      - name: Consultar avisos e criar Issue quando necessário
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python dgii_check.py

      - name: Guardar o histórico atualizado no repositório
        run: |
          if git diff --quiet -- data/dgii_known_notices.json; then
            echo "O histórico não sofreu alterações."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dgii_known_notices.json
          git commit -m "Atualizar histórico de avisos DGII"
          git push
