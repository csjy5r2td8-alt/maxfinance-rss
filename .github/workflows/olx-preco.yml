name: Preço Tesla OLX
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Apenas testar leitura, sem enviar
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: olx-tesla-preco
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Consultar preço
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python olx_preco.py --dry-run
          else
            python olx_preco.py
          fi
      - name: Guardar referência após envio
        if: inputs.dry_run == false
        run: |
          git add data/olx_tesla_preco.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Atualizar preço de referência Tesla OLX'
            git pull --rebase origin main
            git push
          fi
