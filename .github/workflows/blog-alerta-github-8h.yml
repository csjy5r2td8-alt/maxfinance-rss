name: Novos artigos Maxfinance - alerta GitHub 8h

on:
  schedule:
    - cron: "15 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: alertas-github-com-estado
  cancel-in-progress: false

jobs:
  verificar-artigos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter o repositório
        uses: actions/checkout@v5
      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Procurar artigos novos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python blog_alerta_github.py
      - name: Guardar artigos já vistos
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- blog_vistos_github.json)" ]; then
            echo "Não há alterações para guardar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog_vistos_github.json
          git commit -m "Atualizar artigos vistos pelo alerta GitHub ($(date -u +%F))"
          git push
