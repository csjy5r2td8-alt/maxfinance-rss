name: Futebol diario

on:
  schedule:
    # Todos os dias as 07:00 UTC (08:00 em Lisboa no verao, 07:00 no inverno).
    - cron: "27 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  futebol:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Ir buscar resultados e preparar email
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python futebol_email.py

      - name: Preparar o assunto
        run: echo "ASSUNTO=$(cat futebol_subject.txt)" >> $GITHUB_ENV

      - name: Enviar email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Futebol <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: ${{ env.ASSUNTO }}
          html_body: file://futebol_body.html
