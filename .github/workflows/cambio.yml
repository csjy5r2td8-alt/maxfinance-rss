name: Cambio BHD diario

"on":
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maxfinance-state-writes
  cancel-in-progress: false

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  cambio:
    runs-on: ubuntu-24.04
    steps:
      - name: Obter o codigo
        uses: actions/checkout@v5

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ler cambio e preparar email
        run: python cambio_email.py

      - name: Preparar o assunto
        run: echo "ASSUNTO=$(cat cambio_subject.txt)" >> $GITHUB_ENV

      - name: Enviar email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Cambio BHD <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: ${{ env.ASSUNTO }}
          html_body: file://cambio_body.html

      - name: Enviar resumo no Telegram
        if: ${{ !cancelled() && hashFiles('cambio_body.html') != '' }}
        run: python telegram_notify.py --html cambio_body.html --subject cambio_subject.txt


      - name: Guardar valores para amanha
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cambio_anterior.json
          if git diff --staged --quiet; then
            echo "Sem alteracoes."
          else
            git commit -m "Atualizar cambio BHD ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main

            git push origin HEAD:main
          fi
